name: Mantener despierta la app (Render gratis)

# Render (plan gratis) duerme la app tras 15 min sin visitas y el conector de Claude tarda ~1 min en
# responder al despertar. Esto la visita cada 10 min de 6:00 a 23:59 hora de Colombia (11:00-04:59 UTC),
# ~19 h/día, para no pasar de las 750 h gratis al mes. También evita que Supabase pause el proyecto.
on:
  schedule:
    - cron: '*/10 0-4,11-23 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visitar /api/health
        run: curl -fsS --max-time 120 https://bolsiuni.onrender.com/api/health
